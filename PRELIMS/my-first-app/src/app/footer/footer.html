<footer>
  <section id="tools">
    <h2 class="section-title">Technical Proficiencies</h2>
    <table>
      <thead>
        <tr>
          <th>Tool</th>
          <th>Level</th>
        </tr>
      </thead>
      <tbody>
        @for (item of proficiencies(); track item.tool) {
          <tr>
            <td>{{ item.tool }}</td>
            <td><span class="level">{{ item.level }}</span></td>
          </tr>
        }
      </tbody>
    </table>
  </section>

  <section id="contact">
    <h2 class="section-title">Contact</h2>
    <div class="contact-links">
      <a class="btn" [href]="'mailto:' + email()">{{ email() }}</a>
      <a class="btn alt" [href]="'tel:' + phone().split(' ').join('')">{{ phone() }}</a>
    </div>
  </section>

  <p class="copyright">&copy; {{ year }} {{ fullName() }}. Built with Angular.</p>
</footer>
