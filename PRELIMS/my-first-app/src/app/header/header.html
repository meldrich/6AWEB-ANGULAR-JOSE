<header class="intro">
  <p class="kicker">Resume</p>
  <h1>{{ fullName() }}</h1>
  <ul class="contact">
    <li>{{ location() }}</li>
    <li>{{ phone() }}</li>
    <li><a [href]="'mailto:' + email()">{{ email() }}</a></li>
  </ul>
</header>

<section id="about">
  <h2 class="section-title">About Me</h2>
  <p class="profile-text">{{ profile() }}</p>
  @if (facts().length) {
    <dl class="facts">
      @for (f of facts(); track f.label) {
        <div>
          <dt>{{ f.label }}</dt>
          <dd>{{ f.value }}</dd>
        </div>
      }
    </dl>
  }
</section>
